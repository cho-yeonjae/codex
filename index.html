<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06122e}
    body{display:grid;place-items:center}
    .artwork{position:relative;width:min(100vw,177.7777778vh);aspect-ratio:16/9;overflow:hidden;z-index:2;container-type:inline-size;background:url('assets/night-sky.png') center/cover no-repeat}
    .stars{position:absolute;inset:0;z-index:3;pointer-events:none}
    .stars i{position:absolute;width:calc(var(--s)*.52);height:calc(var(--s)*.52);margin:calc(var(--s)*-.26);border-radius:50%;background:#fff7c7;filter:drop-shadow(0 0 2px #fff4b0);animation:illustratedTwinkle var(--d) ease-in-out infinite;animation-delay:var(--l)}
    .stars i:before,.stars i:after{content:'';position:absolute;left:50%;top:50%;background:linear-gradient(90deg,transparent,#fffbe2,transparent);transform:translate(-50%,-50%);opacity:.55}
    .stars i:before{width:250%;height:1px}.stars i:after{height:250%;width:1px}
    @keyframes illustratedTwinkle{0%,100%{opacity:.2;transform:scale(.58)}48%{opacity:.95;transform:scale(1.08)}60%{opacity:.65;transform:scale(.86)}}
    .slow-zone{position:absolute;left:42.5cqw;top:20.625cqw;width:15cqw;aspect-ratio:1;border-radius:50%;z-index:2;pointer-events:none;border:1px solid rgba(255,239,174,.16);box-shadow:inset 0 0 2cqw rgba(255,222,137,.06),0 0 1.5cqw rgba(255,214,118,.05)}
    .meteor-group{position:absolute;width:min(33.6cqw,486px);aspect-ratio:2.37/1;left:50cqw;top:8cqw;opacity:0;pointer-events:none;z-index:4;mix-blend-mode:screen}
    .meteor-field{position:absolute;inset:0;z-index:4;pointer-events:none;clip-path:polygon(0 0,100% 0,100% 71%,96% 72%,90% 75%,84% 74%,79% 72%,73% 72%,67% 77%,61% 77%,55% 78%,50% 80%,45% 78%,40% 75%,35% 76%,29% 75%,24% 70%,18% 70%,14% 68%,10% 59%,7% 52%,4% 54%,0 47%)}
    .hero-head{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 7px rgba(255,231,153,.85))}
    .streaks{position:absolute;inset:0;z-index:3;pointer-events:none}.streak{position:absolute;left:var(--x);top:var(--y);width:calc(var(--len)*1.35);height:auto;opacity:0;transform:rotate(-28deg);transform-origin:10% 75%;mix-blend-mode:screen;filter:drop-shadow(0 0 3px rgba(255,226,145,.62))}
    a-scene{position:fixed!important;inset:0!important;z-index:1!important;pointer-events:none!important}a-scene canvas{opacity:0!important}
  </style>
  <style>
    /* 산 능선 아래는 별똥별이 닿는 즉시 가려지는 하늘 영역 */
    .streaks{clip-path:polygon(0 0,100% 0,100% 71%,96% 72%,90% 75%,84% 74%,79% 72%,73% 72%,67% 77%,61% 77%,55% 78%,50% 80%,45% 78%,40% 75%,35% 76%,29% 75%,24% 70%,18% 70%,14% 68%,10% 59%,7% 52%,4% 54%,0 47%)}
  </style>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
  <script>AFRAME.registerComponent('meteor-trigger',{init:function(){const fire=()=>{if(typeof window.playMeteor==='function')window.playMeteor();else window.__meteorQueued=true};this.el.addEventListener('markerFound',fire);this.el.sceneEl.addEventListener('markerFound',fire)}})</script>
</head>
<body>
  <div class="artwork">
    <div class="stars">
      <i style="left:24.6%;top:-1%;--s:9px;--d:2.5s;--l:-.4s"></i><i style="left:50.8%;top:-1%;--s:7px;--d:2.1s;--l:-1.3s"></i><i style="left:56.8%;top:5%;--s:18px;--d:3s;--l:-.7s"></i><i style="left:65.9%;top:8%;--s:10px;--d:2.4s;--l:-1.6s"></i><i style="left:86.3%;top:4%;--s:13px;--d:2.7s;--l:-.5s"></i><i style="left:56.3%;top:19%;--s:8px;--d:2.1s;--l:-1.1s"></i><i style="left:62.2%;top:20%;--s:6px;--d:1.8s;--l:-.9s"></i><i style="left:51%;top:28%;--s:8px;--d:2.6s;--l:-1.9s"></i><i style="left:62.3%;top:30%;--s:12px;--d:2.2s;--l:-.2s"></i><i style="left:68.8%;top:37%;--s:11px;--d:2.8s;--l:-1.5s"></i><i style="left:78.1%;top:34%;--s:7px;--d:2s;--l:-.6s"></i><i style="left:89%;top:43%;--s:10px;--d:2.5s;--l:-1.4s"></i><i style="left:73.9%;top:50%;--s:6px;--d:1.9s;--l:-1s"></i>
    </div>
    <div class="slow-zone"></div>
    <div class="meteor-field">
    <div class="streaks" id="streaks"><img class="streak fast" src="assets/small-meteor.png" data-dx="-18" data-dy="10" style="--x:15cqw;--y:8cqw;--len:12cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-21" data-dy="12" style="--x:27cqw;--y:18cqw;--len:9cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-20" data-dy="11" style="--x:18cqw;--y:35cqw;--len:11cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-20" data-dy="11" style="--x:34cqw;--y:46cqw;--len:10cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-18" data-dy="10" style="--x:27cqw;--y:7cqw;--len:8cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-22" data-dy="13" style="--x:76cqw;--y:7cqw;--len:12cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-24" data-dy="13" style="--x:85cqw;--y:18cqw;--len:10cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-20" data-dy="12" style="--x:75cqw;--y:37cqw;--len:11cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-25" data-dy="13" style="--x:87cqw;--y:44cqw;--len:9cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-15" data-dy="9" style="--x:48cqw;--y:5cqw;--len:7cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-16" data-dy="9" style="--x:52cqw;--y:49cqw;--len:9cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-16" data-dy="9" style="--x:11cqw;--y:25cqw;--len:8cqw" alt=""><img class="streak fast" src="assets/small-meteor.png" data-dx="-23" data-dy="13" style="--x:90cqw;--y:30cqw;--len:10cqw" alt=""><img class="streak slow" src="assets/small-meteor.png" style="--x:62cqw;--y:16cqw;--len:12cqw" alt=""><img class="streak slow" src="assets/small-meteor.png" style="--x:58cqw;--y:21cqw;--len:9cqw" alt=""><img class="streak slow" src="assets/small-meteor.png" style="--x:68cqw;--y:11cqw;--len:8cqw" alt=""><img class="streak slow" src="assets/small-meteor.png" style="--x:66cqw;--y:18cqw;--len:7cqw" alt=""><img class="streak slow" src="assets/small-meteor.png" style="--x:56cqw;--y:13cqw;--len:8cqw" alt=""><img class="streak slow" src="assets/small-meteor.png" style="--x:64cqw;--y:25cqw;--len:7cqw" alt=""></div>
    <div class="meteor-group" id="meteor"><img class="hero-head" src="assets/center-meteor-v2.png"></div>
    </div>
  </div>
  <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3" renderer="alpha:true" vr-mode-ui="enabled:false"><a-marker preset="hiro" id="marker" emitevents="true" meteor-trigger><a-entity></a-entity></a-marker><a-entity camera></a-entity></a-scene>
  <script>
    const m=document.querySelector('#meteor');const streaks=[...document.querySelectorAll('.streak')];const artwork=document.querySelector('.artwork');let last=0;
    const glow=()=> 'none';
    function playMeteor(){const now=performance.now();if(now-last<900)return;last=now;const u=artwork.clientWidth/100;const hero=(x,y,s)=>`translate(${x*u}px,${y*u}px) scale(${s})`;const line=(x,y)=>`translate(${x*u}px,${y*u}px) rotate(-28deg)`;m.getAnimations().forEach(a=>a.cancel());m.style.opacity='1';m.style.transform=hero(0,0,.78);requestAnimationFrame(()=>m.animate([
      {transform:hero(0,0,.78),opacity:0,filter:glow(.9)},
      {transform:hero(-10,5.6,.82),opacity:.98,filter:glow(.94),offset:.15},
      {transform:hero(-14,7.9,.85),opacity:.97,filter:glow(1.04),offset:.42},
      {transform:hero(-20,11.2,.88),opacity:.95,filter:glow(.95),offset:.47},
      {transform:hero(-45,25.3,.93),opacity:0,filter:glow(.9)}
    ],{duration:11000,fill:'forwards',easing:'linear'}));const slowFrames=[{transform:line(0,0),opacity:0},{transform:line(-10,5.6),opacity:.9,offset:.15},{transform:line(-14,7.9),opacity:.78,offset:.42},{transform:line(-20,11.2),opacity:.66,offset:.47},{transform:line(-45,25.3),opacity:0}];streaks.forEach((s,i)=>{s.getAnimations().forEach(a=>a.cancel());const isSlow=s.classList.contains('slow');const dx=Number(s.dataset.dx||-45);const dy=Number(s.dataset.dy||25.3);const frames=isSlow?slowFrames:[{transform:line(0,0),opacity:0},{transform:line(dx*.12,dy*.12),opacity:.9,offset:.08},{transform:line(dx,dy),opacity:0}];s.animate(frames,{duration:isSlow?11000:2400,delay:i*55,fill:'forwards',easing:'linear'})})}
    window.playMeteor=playMeteor;
    const marker=document.querySelector('#marker');const scene=document.querySelector('a-scene');
    marker.addEventListener('markerFound',playMeteor);scene.addEventListener('markerFound',playMeteor);
    let markerWasVisible=false;function watchMarker(){const visible=Boolean(marker.object3D&&marker.object3D.visible);if(visible&&!markerWasVisible)playMeteor();markerWasVisible=visible;requestAnimationFrame(watchMarker)}watchMarker();
    if(window.__meteorQueued){window.__meteorQueued=false;playMeteor()}
  </script>
</body>
</html>
