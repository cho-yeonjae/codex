<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06122e}body{background:url('assets/night-sky.png') center/cover no-repeat}.stars{position:fixed;inset:0;z-index:3;pointer-events:none}.stars i{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:#fff7c7;filter:drop-shadow(0 0 3px #fff4b0);animation:illustratedTwinkle var(--d) ease-in-out infinite;animation-delay:var(--l)}.stars i:before,.stars i:after{content:'';position:absolute;left:50%;top:50%;background:linear-gradient(90deg,transparent,#fffbe2,transparent);transform:translate(-50%,-50%);opacity:.7}.stars i:before{width:320%;height:1px}.stars i:after{height:320%;width:1px}@keyframes illustratedTwinkle{0%,100%{opacity:.22;transform:scale(.55)}48%{opacity:1;transform:scale(1.22)}60%{opacity:.72;transform:scale(.9)}}.meteor{position:fixed;width:42vw;max-width:620px;right:-10vw;top:10vh;opacity:0;transition:opacity 1s;pointer-events:none;z-index:4}a-scene{opacity:0!important;pointer-events:none!important}</style><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.min.js"></script></head><body><div class="stars"><i style="left:24.6%;top:-1%;--s:9px;--d:2.5s;--l:-.4s"></i><i style="left:50.8%;top:-1%;--s:7px;--d:2.1s;--l:-1.3s"></i><i style="left:56.8%;top:5%;--s:18px;--d:3s;--l:-.7s"></i><i style="left:65.9%;top:8%;--s:10px;--d:2.4s;--l:-1.6s"></i><i style="left:86.3%;top:4%;--s:13px;--d:2.7s;--l:-.5s"></i><i style="left:56.3%;top:19%;--s:8px;--d:2.1s;--l:-1.1s"></i><i style="left:62.2%;top:20%;--s:6px;--d:1.8s;--l:-.9s"></i><i style="left:51%;top:28%;--s:8px;--d:2.6s;--l:-1.9s"></i><i style="left:62.3%;top:30%;--s:12px;--d:2.2s;--l:-.2s"></i><i style="left:68.8%;top:37%;--s:11px;--d:2.8s;--l:-1.5s"></i><i style="left:78.1%;top:34%;--s:7px;--d:2s;--l:-.6s"></i><i style="left:89%;top:43%;--s:10px;--d:2.5s;--l:-1.4s"></i><i style="left:73.9%;top:50%;--s:6px;--d:1.9s;--l:-1s"></i></div><img class="meteor" id="meteor" src="assets/shooting-star.png"><a-scene embedded arjs="sourceType:webcam;debugUIEnabled:false" renderer="alpha:true"><a-marker preset="hiro" id="marker"></a-marker><a-entity camera></a-entity></a-scene><script>const m=document.querySelector('#meteor');const k=document.querySelector('#marker');k.addEventListener('markerFound',()=>{m.style.opacity=1;m.animate([{transform:'translate(0,0)'},{transform:'translate(-95vw,55vh)'}],{duration:14000,fill:'forwards'})});k.addEventListener('markerLost',()=>m.style.opacity=0)</script></body></html>
