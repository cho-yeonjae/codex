<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06122e}body{background:url('assets/night-sky.png') center/cover no-repeat}.stars{position:fixed;inset:0;background:radial-gradient(circle at 20% 18%,#ffe9a5 0 2px,transparent 3px),radial-gradient(circle at 68% 25%,#ffe9a5 0 2px,transparent 3px),radial-gradient(circle at 82% 45%,#ffe9a5 0 2px,transparent 3px);animation:pulse 2s ease-in-out infinite alternate}.meteor{position:fixed;width:42vw;max-width:620px;right:-10vw;top:10vh;opacity:0;transition:opacity 1s;pointer-events:none;z-index:2}a-scene{opacity:0!important;pointer-events:none!important}@keyframes pulse{to{opacity:.45}}</style><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.min.js"></script></head><body><div class="stars"></div><img class="meteor" id="meteor" src="assets/shooting-star.png"><a-scene embedded arjs="sourceType:webcam;debugUIEnabled:false" renderer="alpha:true"><a-marker preset="hiro" id="marker"></a-marker><a-entity camera></a-entity></a-scene><script>const m=document.querySelector('#meteor');const k=document.querySelector('#marker');k.addEventListener('markerFound',()=>{m.style.opacity=1;m.animate([{transform:'translate(0,0)'},{transform:'translate(-95vw,55vh)'}],{duration:14000,fill:'forwards'})});k.addEventListener('markerLost',()=>m.style.opacity=0)</script></body></html>
