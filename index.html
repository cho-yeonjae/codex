<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06122e}body{background:url('assets/night-sky.png') center/cover no-repeat}.stars{position:fixed;inset:0;z-index:3;pointer-events:none}.stars i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff4bd;box-shadow:0 0 7px 2px #ffd86e;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--l)}@keyframes twinkle{0%,100%{opacity:.18;transform:scale(.45)}50%{opacity:1;transform:scale(1.8)}}.meteor{position:fixed;width:42vw;max-width:620px;right:-10vw;top:10vh;opacity:0;transition:opacity 1s;pointer-events:none;z-index:4}a-scene{opacity:0!important;pointer-events:none!important}</style><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.min.js"></script></head><body><div class="stars"><i style="left:12%;top:16%;--d:1.7s;--l:-.4s"></i><i style="left:26%;top:12%;--d:2.6s;--l:-1.1s"></i><i style="left:42%;top:23%;--d:2s;--l:-.7s"></i><i style="left:58%;top:15%;--d:3.1s;--l:-2s"></i><i style="left:75%;top:27%;--d:1.9s;--l:-.8s"></i><i style="left:89%;top:12%;--d:2.8s;--l:-1.5s"></i><i style="left:18%;top:39%;--d:2.3s;--l:-.9s"></i><i style="left:35%;top:34%;--d:1.6s;--l:-1.2s"></i><i style="left:53%;top:42%;--d:2.9s;--l:-.2s"></i><i style="left:68%;top:36%;--d:1.8s;--l:-1.4s"></i><i style="left:83%;top:43%;--d:2.4s;--l:-.5s"></i><i style="left:92%;top:32%;--d:3.2s;--l:-2.3s"></i></div><img class="meteor" id="meteor" src="assets/shooting-star.png"><a-scene embedded arjs="sourceType:webcam;debugUIEnabled:false" renderer="alpha:true"><a-marker preset="hiro" id="marker"></a-marker><a-entity camera></a-entity></a-scene><script>const m=document.querySelector('#meteor');const k=document.querySelector('#marker');k.addEventListener('markerFound',()=>{m.style.opacity=1;m.animate([{transform:'translate(0,0)'},{transform:'translate(-95vw,55vh)'}],{duration:14000,fill:'forwards'})});k.addEventListener('markerLost',()=>m.style.opacity=0)</script></body></html>
