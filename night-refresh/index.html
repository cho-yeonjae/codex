<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>밤하늘</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#07112a; }
    body { display:flex; align-items:center; justify-content:center; }
    #night { position:relative; width:100vw; height:56.25vw; max-height:100vh; overflow:hidden; background:#07112a url('assets/night-sky.png') center center / cover no-repeat; }
    @media screen and (max-width: 900px) { #night { width:177.777vh; height:100vh; max-width:100vw; } }
    .stars, .stars i { position:absolute; pointer-events:none; }
    .stars { inset:0; }
    .stars i { display:block; border-radius:50%; background:#fff3b3; opacity:.25; box-shadow:0 0 5px #fff0a5; -webkit-animation:twinkle 3.8s ease-in-out infinite; animation:twinkle 3.8s ease-in-out infinite; }
    .stars i:nth-child(2n) { -webkit-animation-duration:5.4s; animation-duration:5.4s; }
    .stars i:nth-child(3n) { -webkit-animation-duration:4.5s; animation-duration:4.5s; }
    @-webkit-keyframes twinkle { 0%,100%{opacity:.15;-webkit-transform:scale(.75)} 50%{opacity:.72;-webkit-transform:scale(1.25)} }
    @keyframes twinkle { 0%,100%{opacity:.15;transform:scale(.75)} 50%{opacity:.72;transform:scale(1.25)} }
    #lens { position:absolute; z-index:4; width:22vw; height:22vw; max-width:270px; max-height:270px; left:calc(50% - 11vw); top:calc(46% - 11vw); border-radius:50%; opacity:0; pointer-events:none; background:radial-gradient(ellipse at 35% 28%, rgba(255,255,255,.27), rgba(201,228,255,.08) 45%, rgba(236,249,255,.22) 77%, rgba(255,255,255,.04) 100%); box-shadow:inset 0 0 0 2px rgba(240,250,255,.34), inset 9px 10px 16px rgba(255,255,255,.13), 0 0 14px rgba(205,234,255,.18); -webkit-transition:opacity .45s ease; transition:opacity .45s ease; }
    #lens.show { opacity:1; }
    #meteor { position:absolute; z-index:3; top:8%; left:49%; width:26vw; max-width:350px; min-width:160px; opacity:0; pointer-events:none; }
    #meteor img { display:block; width:100%; height:auto; }
    #meteor.run { -webkit-animation:fall 10s linear forwards; animation:fall 10s linear forwards; }
    @-webkit-keyframes fall { 0%{opacity:0;-webkit-transform:translate(0,0) scale(.73)} 8%{opacity:1} 72%{opacity:.95} 100%{opacity:0;-webkit-transform:translate(-39vw,26vw) scale(.89)} }
    @keyframes fall { 0%{opacity:0;transform:translate(0,0) scale(.73)} 8%{opacity:1} 72%{opacity:.95} 100%{opacity:0;transform:translate(-39vw,26vw) scale(.89)} }
    a-scene { position:fixed!important; left:0!important; top:0!important; z-index:0!important; width:100vw!important; height:100vh!important; opacity:0!important; pointer-events:none!important; overflow:hidden!important; }
    a-scene video, a-scene canvas { visibility:hidden!important; }
  </style>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <main id="night">
    <div class="stars" aria-hidden="true">
      <i style="left:50%;top:7%;width:4px;height:4px"></i><i style="left:61%;top:12%;width:3px;height:3px"></i><i style="left:72%;top:8%;width:5px;height:5px"></i><i style="left:80%;top:18%;width:3px;height:3px"></i><i style="left:56%;top:23%;width:3px;height:3px"></i><i style="left:66%;top:28%;width:4px;height:4px"></i><i style="left:86%;top:31%;width:3px;height:3px"></i><i style="left:47%;top:32%;width:3px;height:3px"></i><i style="left:74%;top:38%;width:3px;height:3px"></i><i style="left:91%;top:24%;width:4px;height:4px"></i><i style="left:59%;top:43%;width:3px;height:3px"></i><i style="left:82%;top:47%;width:3px;height:3px"></i>
    </div>
    <div id="lens" aria-hidden="true"></div>
    <div id="meteor" aria-hidden="true"><img src="assets/center-meteor-v2.png" alt=""></div>
  </main>
  <a-scene embedded vr-mode-ui="enabled:false" renderer="antialias:false; alpha:true" arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono; patternRatio:0.5; maxDetectionRate:60; canvasWidth:1280; canvasHeight:720;">
    <a-marker id="marker" type="pattern" url="assets/boo-marker.patt" emitevents="true" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2"><a-entity></a-entity></a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
  (function () {
    var scene = document.querySelector('a-scene');
    var marker = document.getElementById('marker');
    var frame = document.getElementById('night');
    var lens = document.getElementById('lens');
    var meteor = document.getElementById('meteor');
    var pointerMode = false;
    var visibleLast = false;
    var lensTimer = 0;
    function startMeteor() { meteor.className = ''; void meteor.offsetWidth; meteor.className = 'run'; }
    function showLens() { lens.className = 'show'; window.clearTimeout(lensTimer); lensTimer = window.setTimeout(function () { if (!pointerMode) lens.className = ''; }, 1800); }
    function markerSeen() { showLens(); startMeteor(); }
    marker.addEventListener('markerFound', markerSeen, false);
    scene.addEventListener('markerFound', markerSeen, false);
    frame.addEventListener('mousemove', function (event) {
      var rect, x, y;
      if (!pointerMode) return;
      rect = frame.getBoundingClientRect(); x = ((event.clientX - rect.left) / rect.width) * 100; y = ((event.clientY - rect.top) / rect.height) * 100;
      lens.style.left = 'calc(' + x + '% - 11vw)'; lens.style.top = 'calc(' + y + '% - 11vw)'; showLens();
    }, false);
    window.addEventListener('keydown', function (event) { if (event.key === 'a' || event.key === 'A') { pointerMode = !pointerMode; if (pointerMode) { showLens(); startMeteor(); } else lens.className = ''; } }, false);
    function pollMarker() { var isVisible = !!(marker.object3D && marker.object3D.visible); if (isVisible && !visibleLast) markerSeen(); visibleLast = isVisible; window.requestAnimationFrame(pollMarker); }
    pollMarker();
  }());
  </script>
</body>
</html>
