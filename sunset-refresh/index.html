<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <script>var build='legacy-safari-c3';if(new URLSearchParams(location.search).get('build')!==build)location.replace(location.pathname+'?build='+build);</script>
  <title>노을</title>
  <link rel="stylesheet" href="styles.css?v=legacy-safari-c3">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <svg class="filters" aria-hidden="true" focusable="false">
    <filter id="soft-current" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence id="water-current" type="fractalNoise" baseFrequency="0.0012 0.011" numOctaves="1" seed="11" result="noise"></feTurbulence>
      <feDisplacementMap id="water-displacement" in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
  </svg>
  <main class="artwork" aria-label="노을과 바다">
    <img class="backdrop" src="assets/sunset-sea.png" alt="">
    <canvas id="motion" aria-hidden="true"></canvas>
    <div class="lens" aria-hidden="true"><div class="lens-glass"></div></div>
  </main>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;" renderer="alpha: true" vr-mode-ui="enabled: false">
    <a-marker id="marker" preset="hiro" emitevents="true">
      <a-entity></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script src="script.js?v=hold-lens-9c514d2"></script>
</body>
</html>
